# Configuracion de pruebas de fasting-service.
#
# Hasta ahora solo hacia falta apagar el banner y Eureka, porque todas las
# pruebas eran unitarias o @WebMvcTest y ninguna levantaba la aplicacion
# entera. Al anadir AislamientoEnAyunoTest —que si la levanta, con base de
# datos y cadena de filtros de verdad— hicieron falta el datasource y el
# secreto del JWT. Sin el secreto, SecParams no se puede construir y el
# contexto ni arranca.
spring.main.banner-mode=off
eureka.client.enabled=false

server.port=0

spring.datasource.url=jdbc:h2:mem:fastingtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway se apaga aqui a proposito: el esquema de las pruebas lo genera
# Hibernate con create-drop. Que las migraciones cuadran con el mapeo lo
# comprueba ElEsquemaCuadraConElCodigoTest, que si las ejecuta.
spring.flyway.enabled=false

secret=test-secret-key
expired-time=864000000
