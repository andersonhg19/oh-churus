# ---------------------------------------------------------------------------
# TECHOS DE MEMORIA
#
# Sin ellos la JVM coge hasta un cuarto de la RAM de la maquina: medido con
# `docker stats` sobre este mismo stack, los cinco servicios sumaban 3,1 GB en
# un equipo de 47 GB. Esa cifra no dice lo que el servicio NECESITA, dice lo
# que el equipo le dejaba coger.
#
# Con MaxRAMPercentage la JVM se ajusta al limite del CONTENEDOR y no al de la
# maquina, asi que este mismo compose se porta igual en un portatil que en un
# servidor pequeno. El stack completo baja de 3,1 GB a ~1,5 GB.
#
# Los numeros salen de la medicion y no de un catalogo: budget-service es el
# que mas trabaja —movimientos, reparto, sobres, importacion— y lleva mas.
# UseSerialGC porque con heaps de 300 MB el recolector paralelo gasta mas en
# hilos de lo que ahorra.
# ---------------------------------------------------------------------------

networks:
  oh-churus-network:
    driver: bridge

volumes:
  postgres-data:

services:
  # ==================== DATABASE ====================
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-OhChurus2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init-db/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    mem_limit: 256m
    networks:
      - oh-churus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== INFRASTRUCTURE ====================
  discovery-service:
    image: oh-churus-discovery
    build:
      context: ./backend/discovery-service
    ports:
      - "8760:8760"
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Xss512k -XX:+UseSerialGC"
    networks:
      - oh-churus-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8760/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway-service:
    image: oh-churus-gateway
    build:
      context: ./backend/gateway-service
    ports:
      - "8820:8820"
    depends_on:
      discovery-service:
        condition: service_healthy
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Xss512k -XX:+UseSerialGC"
    networks:
      - oh-churus-network

  # ==================== MICROSERVICES ====================
  auth-service:
    image: oh-churus-auth
    build:
      context: ./backend/auth-service
    ports:
      - "127.0.0.1:8821:8821"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Xss512k -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-OhChurus2026}
      SECRET: ${SECRET:-ohchurus@secret.key}
      EXP_TIME: ${EXP_TIME:-864000000}
    mem_limit: 448m
    networks:
      - oh-churus-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8821/oh-churus/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  budget-service:
    image: oh-churus-budget
    build:
      context: ./backend/budget-service
    ports:
      - "127.0.0.1:8823:8823"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Xss512k -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/budget_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-OhChurus2026}
      SECRET: ${SECRET:-ohchurus@secret.key}
    mem_limit: 512m
    networks:
      - oh-churus-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8823/oh-churus/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  fasting-service:
    image: oh-churus-fasting
    build:
      context: ./backend/fasting-service
    ports:
      - "127.0.0.1:8825:8825"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Xss512k -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fasting_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-OhChurus2026}
      SECRET: ${SECRET:-ohchurus@secret.key}
    mem_limit: 448m
    networks:
      - oh-churus-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8825/oh-churus/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== FRONTEND ====================
  frontend:
    image: oh-churus-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${API_URL:-http://192.168.1.9:8820}
    ports:
      - "3000:3000"
    depends_on:
      - gateway-service
    networks:
      - oh-churus-network
