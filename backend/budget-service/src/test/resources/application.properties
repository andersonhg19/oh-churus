server.port=0
spring.application.name=budget-service-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Las pruebas montan el esquema con las MISMAS migraciones que produccion. Si
# se dejara create-drop, Hibernate se fabricaria las tablas por su cuenta y una
# migracion rota no se notaria hasta desplegar.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/comun,classpath:db/migration/{vendor}

# Los datos de ejemplo son para la app arrancada, no para las pruebas: cada
# prueba de integracion monta su propio escenario y lo primero que hace es
# vaciar las tablas. Con el esquema en manos de Flyway la base ya no se
# recrea entre contextos, asi que sembrarla solo deja restos de por medio.
app.seed-data-enabled=false

eureka.client.enabled=false

secret=test-secret-key

app.currency=COP
app.decimal-places=0

# Apaga el banner ASCII de Spring Boot en tests (salida limpia para la demo)
spring.main.banner-mode=off
