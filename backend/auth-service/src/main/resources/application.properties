server.port=8821
server.servlet.context-path=/oh-churus
spring.application.name=auth-service

spring.config.import=optional:file:.env[.properties]

eureka.instance.preferIpAddress=true
spring.cloud.discovery.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:OhChurus2026}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Antes decia "update": Hibernate se inventaba el esquema al arrancar y, cuando
# el cambio no le cabia (un NOT NULL sobre una tabla con datos), lo dejaba en un
# WARN y arrancaba igual con la base desincronizada. Ahora el esquema lo pone
# Flyway y aqui solo se comprueba que coincida con el mapeo; si no, no arranca.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# La base de datos de desarrollo ya tiene las tablas y datos reales: sin
# baseline, Flyway se negaria a migrar un esquema que no creo el.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

eureka.client.serviceUrl.defaultZone=http://discovery-service:8760/eureka

secret=${SECRET:ohchurus@secret.key}
expired-time=${EXP_TIME:864000000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
