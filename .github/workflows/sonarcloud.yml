name: SonarCloud

# Se ejecuta en cada push a main y en cada Pull Request hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analysis:
    name: Build, test & SonarCloud scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # SonarCloud necesita el historial completo para calcular "new code".
          fetch-depth: 0

      # ---------- BACKEND (Java / Maven) ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Backend - tests + cobertura (JaCoCo)
        working-directory: backend
        run: mvn -B clean verify

      - name: Backend - copiar dependencias (para sonar.java.libraries)
        working-directory: backend
        run: >
          mvn -B dependency:copy-dependencies
          -DoutputDirectory=target/dependency
          -pl auth-service,budget-service,fasting-service,discovery-service,gateway-service

      # ---------- FRONTEND (React Native / Jest) ----------
      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - install + cobertura (Jest -> LCOV)
        working-directory: frontend
        run: |
          npm ci
          npx jest --coverage --maxWorkers=50% --ci

      # ---------- ANALISIS SONARCLOUD ----------
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
