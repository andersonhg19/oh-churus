# ============================================================================
# Oh Churus! - Configuracion SonarQube (SonarScanner CLI)
# ----------------------------------------------------------------------------
# Uso:
#   1) Generar reportes de cobertura:  (desde backend/)  mvn clean verify
#   2) Ejecutar el analisis:           (desde la raiz)   sonar-scanner
#
# Alternativa (proyecto Maven): desde backend/ ejecutar
#   mvn clean verify sonar:sonar -Dsonar.host.url=http://localhost:9000 -Dsonar.token=XXXX
#   (el scanner de Maven autodetecta modulos, fuentes, binarios y JaCoCo)
# ============================================================================

# IMPORTANTE: estos 2 valores los define SonarCloud al importar el repo.
# Verificalos en SonarCloud -> tu proyecto -> Information (panel derecho).
# Por defecto SonarCloud usa  <tu-usuario>_<repo>  como projectKey y tu usuario como organization.
sonar.projectKey=andersonhg19_oh-churus
sonar.organization=andersonhg19
sonar.projectName=Oh Churus!
sonar.projectVersion=1.0

# --- Codificacion / Java ---
sonar.sourceEncoding=UTF-8
sonar.java.source=17

# ============================================================================
# BACKEND (Java / Spring Boot - 5 microservicios)
# ============================================================================
sonar.sources=\
  backend/discovery-service/src/main/java,\
  backend/gateway-service/src/main/java,\
  backend/auth-service/src/main/java,\
  backend/budget-service/src/main/java,\
  backend/fasting-service/src/main/java,\
  frontend/src

sonar.tests=\
  backend/auth-service/src/test/java,\
  backend/budget-service/src/test/java,\
  backend/fasting-service/src/test/java,\
  backend/discovery-service/src/test/java,\
  backend/gateway-service/src/test/java

# Bytecode compilado (requerido por el analizador de Java)
sonar.java.binaries=\
  backend/discovery-service/target/classes,\
  backend/gateway-service/target/classes,\
  backend/auth-service/target/classes,\
  backend/budget-service/target/classes,\
  backend/fasting-service/target/classes

sonar.java.test.binaries=\
  backend/auth-service/target/test-classes,\
  backend/budget-service/target/test-classes,\
  backend/fasting-service/target/test-classes

# Dependencias (.jar) para un analisis Java preciso. El CI las copia con
# 'mvn dependency:copy-dependencies' a target/dependency de cada modulo.
# Resuelve el warning "sonar.java.libraries is empty".
sonar.java.libraries=\
  backend/auth-service/target/dependency/*.jar,\
  backend/budget-service/target/dependency/*.jar,\
  backend/fasting-service/target/dependency/*.jar,\
  backend/discovery-service/target/dependency/*.jar,\
  backend/gateway-service/target/dependency/*.jar
sonar.java.test.libraries=\
  backend/auth-service/target/dependency/*.jar,\
  backend/budget-service/target/dependency/*.jar,\
  backend/fasting-service/target/dependency/*.jar

# Reportes de cobertura JaCoCo (solo los modulos con logica de negocio)
# IMPORTANTE: la propiedad correcta es sonar.coverage.jacoco.xmlReportPaths (con .xml)
sonar.coverage.jacoco.xmlReportPaths=\
  backend/auth-service/target/site/jacoco/jacoco.xml,\
  backend/budget-service/target/site/jacoco/jacoco.xml,\
  backend/fasting-service/target/site/jacoco/jacoco.xml

# Reportes de tests (Surefire)
sonar.junit.reportPaths=\
  backend/auth-service/target/surefire-reports,\
  backend/budget-service/target/surefire-reports,\
  backend/fasting-service/target/surefire-reports

# Nota: las exclusiones de cobertura (sonar.coverage.exclusions) estan definidas
# mas abajo de forma combinada para backend + frontend.
# El codigo generado por Lombok ya se excluye via @lombok.Generated (lombok.config).

# Excluir codigo de infraestructura de servicios sin logica del analisis de duplicados
sonar.cpd.exclusions=\
  **/dto/**,\
  **/entity/**

# ============================================================================
# FRONTEND (React Native / TypeScript)
# Cobertura Jest: (desde frontend/)  npx jest --coverage  -> coverage/lcov.info
# ============================================================================
# Los archivos de test del frontend viven junto al codigo (src/**/__tests__);
# se reclasifican como tests via test.inclusions.
sonar.test.inclusions=\
  frontend/src/**/__tests__/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Excluir dependencias, artefactos y boilerplate sin logica de la cobertura
sonar.coverage.exclusions=\
  **/*Application.java,\
  **/config/**,\
  **/security/SecurityConfig.java,\
  **/security/SecurityBeansConfig.java,\
  **/security/SecParams.java,\
  **/security/JWTAuthorizationFilter.java,\
  **/security/MyUserDetailsService.java,\
  **/enums/Message*.java,\
  **/entity/**,\
  **/dto/**,\
  frontend/src/types/**,\
  frontend/src/theme/**,\
  frontend/src/navigation/**,\
  frontend/App.tsx,\
  frontend/index.ts

# Excluir dependencias y artefactos del analisis
sonar.exclusions=\
  **/node_modules/**,\
  **/target/**,\
  **/*.feature,\
  frontend/.expo/**,\
  frontend/coverage/**
