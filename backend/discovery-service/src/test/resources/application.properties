# Config de test = identica a produccion + banner apagado (salida limpia en la demo).
# NO se desactiva el cliente Eureka: el servidor Eureka necesita sus beans.
server.port=8760
spring.application.name=discovery-service

eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false
eureka.client.serviceUrl.defaultZone=http://discovery-service:8760/eureka
eureka.instance.hostname=discovery-service

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Apaga el banner ASCII de Spring Boot en tests.
spring.main.banner-mode=off
