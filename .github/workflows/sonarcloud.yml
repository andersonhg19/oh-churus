name: SonarCloud

# ANALISIS, no puerta. Quien decide si un cambio entra es "Pruebas"
# (.github/workflows/pruebas.yml): build + unitarias + Karate contra el gateway.
# Aqui solo se mide la calidad del codigo y se envia a SonarCloud. Se compila y
# se pasan las pruebas porque Sonar necesita los informes de cobertura
# (jacoco.xml y lcov.info), no para volver a juzgarlas.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

# Mismas versiones fijadas que en el workflow de pruebas: dos CI que compilan
# con herramientas distintas acaban discutiendo entre ellos.
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: temurin
  NODE_VERSION: '24.14.0'

jobs:
  analysis:
    name: Analisis de calidad (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      # ---------- ¿SIRVE EL TOKEN? ----------
      # Va PRIMERO a proposito. El 11 de agosto de 2026 este workflow se paso
      # cuatro minutos compilando el backend, el frontend y toda la cobertura
      # para morir al final con un 403 y doscientas lineas de traza de Java que
      # no decian el motivo: el token habia caducado. Preguntarlo cuesta un
      # segundo y ahorra el resto.
      #
      # OJO: /api/authentication/validate responde 200 aunque el token no
      # valga; el veredicto viene en el cuerpo ({"valid":false}). Mirar solo el
      # codigo HTTP daria por bueno cualquier token.
      - name: Comprobar el SONAR_TOKEN antes de gastar cuatro minutos
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          rechazar() {
            echo "::error title=SONAR_TOKEN::$1"
            {
              echo "### El analisis no se ejecuto"
              echo ""
              echo "$1"
              echo ""
              echo 'Se arregla en un minuto:'
              echo ''
              echo '1. SonarCloud -> tu avatar -> **My Account** -> **Security**'
              echo '2. Genera un token nuevo (tipo *User Token*)'
              echo '3. `gh secret set SONAR_TOKEN --repo '"$GITHUB_REPOSITORY"'`'
              echo ''
              echo 'Esto **no** bloquea nada: quien decide si un cambio entra'
              echo 'es el workflow **Pruebas**. Aqui solo se mide.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          [ -n "$SONAR_TOKEN" ] || rechazar "El secreto SONAR_TOKEN no existe en este repositorio."

          respuesta=$(curl -sS --max-time 30 -u "$SONAR_TOKEN:" \
            https://sonarcloud.io/api/authentication/validate) \
            || rechazar "No se pudo contactar con SonarCloud para validar el token."

          case "$respuesta" in
            *'"valid":true'*) echo "Token valido." ;;
            *) rechazar "SonarCloud rechaza el SONAR_TOKEN (caducado o revocado). Respuesta: $respuesta" ;;
          esac

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # SonarCloud necesita el historial completo para calcular "new code".
          fetch-depth: 0

      # ---------- BACKEND (Java / Maven) ----------
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Backend - tests + cobertura (JaCoCo)
        working-directory: backend
        run: mvn -B clean verify

      - name: Backend - copiar dependencias (para sonar.java.libraries)
        working-directory: backend
        run: >
          mvn -B dependency:copy-dependencies
          -DoutputDirectory=target/dependency
          -pl auth-service,budget-service,fasting-service,discovery-service,gateway-service

      # ---------- FRONTEND (React Native / Jest) ----------
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - install + cobertura (Jest -> LCOV)
        working-directory: frontend
        run: |
          npm ci
          npx jest --coverage --maxWorkers=50% --ci

      # ---------- ANALISIS SONARCLOUD ----------
      # sonarcloud-github-action esta descatalogado: SonarSource unifico Server
      # y Cloud en sonarqube-scan-action. Para Cloud no se pasa SONAR_HOST_URL;
      # la organizacion y la clave del proyecto salen de sonar-project.properties.
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
